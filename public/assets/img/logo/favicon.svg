<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <g stroke="#141a24" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
    <!-- Fuß: kurz und breit, damit er beim Verkleinern nicht als Strich verschwindet -->
    <path d="M96 232 h64" fill="none"/>
    <path d="M128 200 v32" fill="none"/>
    <!-- Gehäuse -->
    <rect x="18" y="26" width="220" height="174" rx="20" fill="#94a3b8"/>
    <!-- Bildfläche: schmaler Rahmen, damit die Flamme die Fläche bekommt -->
    <rect x="38" y="46" width="180" height="134" rx="9" fill="#0b1220" stroke-width="9"/>
  </g>
  <!-- Flamme: eine Silhouette, keine Zacken - das überlebt das Verkleinern -->
  <path d="M128 176
           c-30 -7 -46 -28 -42 -55
           c3 -21 20 -33 18 -55
           c24 13 38 32 42 53
           c7 -9 9 -21 6 -31
           c19 19 26 47 16 68
           c-7 14 -22 23 -40 20 z"
        fill="#f59e0b" stroke="#141a24" stroke-width="9" stroke-linejoin="round"/>
  <path d="M128 160
           c-14 -4 -21 -14 -19 -28
           c2 -11 10 -17 10 -28
           c13 8 20 19 22 32
           c4 -6 5 -12 4 -17
           c10 11 13 26 7 37
           c-4 8 -14 12 -24 4 z"
        fill="#facc15"/>
</svg>
